{% set name = "plateau" %}
{% set version = "4.6.2" %}
{% set python_min = "3.10" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/2f/e7/b21cfa3ecd0125163c56cc62c60851e9c5743583a5f28b55c06767937c99/plateau-{{ version }}.tar.gz
  sha256: da14c588a5000de6faa892ea91837ceef42e8efa1bfcfbce6c99097cb412782c

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv
  number: 0

requirements:
  host:
    - pip
    - python {{ python_min }}
    - setuptools-scm
  run:
    - attrs
    - click
    - dask-core >=2022.5.1
    - decorator
    - msgpack-python >=0.5.2
    - minimalkv >=1.4.2
    - numpy >1.23
    - pandas >=2.0
    - prompt-toolkit
    - pyarrow >=15, !=19.0.0
    - python >={{ python_min }}
    - pyyaml
    - simplejson
    - toolz
    - urlquote >=1.1.3
    - zstandard

test:
  imports:
    - plateau
    - plateau.serialization
    - plateau.api
    - plateau.io
    - plateau.io_components
    - plateau.io.dask
    - plateau.io.testing
    - plateau.io.eager
    - plateau.io.iter

  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://pypi.org/project/plateau/
  license: MIT
  license_file: LICENSE.txt
  summary: A consistent table management library in Python. Flat files, flat land.

extra:
  recipe-maintainers:
    - fjetter
    - IzerOnadimQC
    - DamianB-BitFlipper
    - xhochy
    - janjagusch
