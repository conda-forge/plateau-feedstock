{% set name = "plateau" %}
{% set version = "4.6.1" %}
{% set python_min = "3.10" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/97/ba/71ba1a897d511c743f0e4cc05649ce1cb20ee1a4a9722851f71bf84fa3ab/plateau-{{ version }}.tar.gz
  sha256: dde0a665625afe6a6803274874b35b5aea5bf30d6672837f3884e1129f66b06a

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv
  number: 0

requirements:
  host:
    - pip
    - python {{ python_min }}
    - setuptools-scm
  run:
    - attrs
    - click
    - dask-core >=2022.5.1
    - decorator
    - msgpack-python >=0.5.2
    - minimalkv >=1.4.2
    - numpy >1.23
    - pandas >=2.0
    - prompt-toolkit
    - pyarrow >=15, !=19.0.0
    - python >={{ python_min }}
    - pyyaml
    - simplejson
    - toolz
    - urlquote >=1.1.3
    - zstandard

test:
  imports:
    - plateau
    - plateau.serialization
    - plateau.api
    - plateau.io
    - plateau.io_components
    - plateau.io.dask
    - plateau.io.testing
    - plateau.io.eager
    - plateau.io.iter
    
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://pypi.org/project/plateau/
  license: MIT
  license_file: LICENSE.txt
  summary: A consistent table management library in Python. Flat files, flat land.

extra:
  recipe-maintainers:
    - fjetter
    - IzerOnadimQC
    - DamianB-BitFlipper
    - xhochy
    - janjagusch
